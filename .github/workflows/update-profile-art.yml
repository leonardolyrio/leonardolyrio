name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # Roda diariamente por volta das 06:17 UTC
  workflow_dispatch: {}    # Permite rodar manualmente no GitHub
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # So o necessario para a rotina diaria (o resto do requirements.txt e para gerar o retrato)
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/make_stats_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg contrib-heatmap-mobile.svg stats.svg"
