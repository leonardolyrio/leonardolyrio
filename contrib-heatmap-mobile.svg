  <style>
    .box { rx: 2; ry: 2; transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop 0.6s ease-out both; }
    .box.on { animation: pop 0.6s ease-out both, flash 0.75s ease-out both; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.2); } 60% { opacity: 1; transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes flash { 0% { filter: brightness(2.2); } 45% { filter: brightness(2.2); } 100% { filter: brightness(1); } }
    @media (prefers-reduced-motion: reduce) { .box { opacity: 1 !important; animation: none !important; } }
    .lbl { font: 10px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    .cap { font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .level-0 { fill: #ebedf0; } .level-1 { fill: #9be9a8; } .level-2 { fill: #40c463; } .level-3 { fill: #30a14e; } .level-4 { fill: #216e39; }
    @media (prefers-color-scheme: dark) {
      .level-0 { fill: #1f2630; } .level-1 { fill: #0e4429; } .level-2 { fill: #006d32; } .level-3 { fill: #26a641; } .level-4 { fill: #39d353; }
      .lbl { fill: #8b949e; } .cap { fill: #e6edf3; }
    }
  </style>
