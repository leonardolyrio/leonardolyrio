    <text class="value" x="217" y="207">3.5</text>
    <text class="sub" x="217" y="222">contributions</text>
  </g>
  <g class="tile" style="animation-delay: 0.72s">
    <rect class="panel" x="12" y="234" width="376" height="118" rx="6" />
