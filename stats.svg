<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <style>
    .frame { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .title { font: 9px "SF Mono", Menlo, Consolas, "Courier New", monospace; fill: #57606a; }
    .label { font: 10px "SF Mono", Menlo, Consolas, "Courier New", monospace; fill: #57606a; }
    .sub, .unit, .month { font: 10px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    .value { font: 700 26px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .value .unit { font-weight: 400; }
    .accent { fill: #1a7f37; }
    .bar { fill: #2da44e; }
    .bar.hi { fill: #1a7f37; }
    .peak { font: 700 9px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .tile { opacity: 0; animation: fadeIn 0.6s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow 0.8s ease-out forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; stroke: #30363d; }
      .title, .label, .sub, .unit, .month { fill: #8b949e; }
      .value, .peak { fill: #e6edf3; }
      .accent { fill: #3fb950; }
      .bar { fill: #2ea043; }
      .bar.hi { fill: #56d364; }
    }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="399" height="359" rx="8" />
  <circle cx="16" cy="14" r="4" fill="#ff5f56" />
  <circle cx="29" cy="14" r="4" fill="#ffbd2e" />
  <circle cx="42" cy="14" r="4" fill="#27c93f" />
  <text class="title" x="200" y="17" text-anchor="middle">leonardolyrio@github: ~ $ ./stats.sh</text>
  <g class="tile" style="animation-delay: 0.00s">
